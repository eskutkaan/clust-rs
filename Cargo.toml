[package]
name = "clust-rs"
version = "0.2.0"
edition = "2021"
description = "Multi-threaded consensus clustering for gene-expression matrices"
readme = "README.md"

[lib]
name = "clust_rs"
crate-type = ["rlib"]

[[bin]]
name = "clust-rs"
path = "src/main.rs"

[dependencies]
ndarray = { version = "0.15.6", features = ["rayon"] }
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
